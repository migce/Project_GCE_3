<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Project GCE 3{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body>
    
    <aside class="sidebar" aria-label="Main Navigation">
        <div class="brand" title="Project GCE 3">PG</div>
        <nav class="side-nav">
            <a class="side-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'main:home' %}" title="Home" aria-label="Home">
                <svg viewBox="0 0 24 24" class="icon"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
            </a>
            <a class="side-link {% if request.resolver_match.url_name == 'trading_positions' %}active{% endif %}" href="{% url 'main:trading_positions' %}" title="Trading" aria-label="Trading">
                <svg viewBox="0 0 24 24" class="icon"><path d="M3 21V10"/><path d="M10 21V4"/><path d="M17 21v-7"/><path d="M2 21h20"/></svg>
            </a>
            <a class="side-link {% if request.resolver_match.url_name == 'trading_history' or request.resolver_match.url_name == 'trading_history_ts' or request.resolver_match.url_name == 'trading_history_mt5' %}active{% endif %}" href="{% url 'main:trading_history' %}" title="History" aria-label="History">
                <svg viewBox="0 0 24 24" class="icon"><path d="M3 19V5"/><path d="M3 19h18"/><path d="M6 15l5-5 4 4 5-6"/></svg>
            </a>
            <a class="side-link" href="/admin/" target="_blank" title="Admin" aria-label="Admin">
                <svg viewBox="0 0 24 24" class="icon"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/></svg>
            </a>
        </nav>
    </aside>

    <main class="main-content with-sidebar">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="footer-line footer-top">
            <span class="copyright">&copy; 2025 Project GCE 3</span>
            <span class="mt5-status">
                <span id="footerMT5Status" class="status-indicator">🔴 Disconnected</span>
                <span class="account-data">
                    Balance: <span id="footerBalance" class="value">$0.00</span> | 
                    Equity: <span id="footerEquity" class="value">$0.00</span>
                </span>
            </span>
            <span class="datetime">
                <span id="currentTime" class="time">00:00:00</span>
            </span>
        </div>
        <div class="footer-line footer-bottom">
            <span class="system-info">MetaTrader5 Integration System</span>
            <span class="date-info">
                <span id="currentDate" class="date">January 1, 2025</span>
            </span>
        </div>
    </footer>

    <!-- Global Flowchart Modal -->
    <div id="flowModalOverlay" class="gce-modal-overlay" style="display:none;">
      <div class="gce-modal">
        <div class="gce-modal-header">
          <div class="gce-modal-title">Rules Flowchart</div>
          <button type="button" class="gce-modal-close" aria-label="Close">×</button>
        </div>
        <div class="gce-modal-body">
          <div id="flowModalCanvas" class="gce-flow-root"></div>
        </div>
        <div class="gce-modal-footer">
          <button type="button" class="btn btn-secondary gce-modal-close">Close</button>
        </div>
      </div>
    </div>

    <script>
        // Real-time clock
        function updateDateTime() {
            const now = new Date();
            
            // Update time
            const timeOptions = {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const timeString = now.toLocaleTimeString('en-US', timeOptions);
            document.getElementById('currentTime').textContent = timeString;
            
            // Update date
            const dateOptions = {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };
            const dateString = now.toLocaleDateString('en-US', dateOptions);
            document.getElementById('currentDate').textContent = dateString;
        }

        // Update footer MT5 status
        function updateFooterMT5Status() {
            fetch('/api/mt5/status/')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.connections && data.connections.length > 0) {
                        // Get the first active connection
                        const connection = data.connections[0];
                        const statusElement = document.getElementById('footerMT5Status');
                        const balanceElement = document.getElementById('footerBalance');
                        const equityElement = document.getElementById('footerEquity');
                        
                        if (connection.is_connected) {
                            statusElement.textContent = '🟢 Connected';
                            statusElement.className = 'status-indicator connected';
                        } else {
                            statusElement.textContent = '🔴 Disconnected';
                            statusElement.className = 'status-indicator disconnected';
                        }
                        
                        // Update balance and equity
                        const balance = connection.balance || 0;
                        const equity = connection.equity || 0;
                        balanceElement.textContent = `$${balance.toFixed(2)}`;
                        equityElement.textContent = `$${equity.toFixed(2)}`;
                    } else {
                        document.getElementById('footerMT5Status').textContent = '🔴 No Connection';
                        document.getElementById('footerMT5Status').className = 'status-indicator disconnected';
                        document.getElementById('footerBalance').textContent = '$0.00';
                        document.getElementById('footerEquity').textContent = '$0.00';
                    }
                })
                .catch(error => {
                    console.error('Error updating footer MT5 status:', error);
                    document.getElementById('footerMT5Status').textContent = '⚠️ Error';
                    document.getElementById('footerMT5Status').className = 'status-indicator error';
                });
        }

        // Initialize and start updates
        document.addEventListener('DOMContentLoaded', function() {
            // Update immediately
            updateDateTime();
            updateFooterMT5Status();
            
            // Update time every second
            setInterval(updateDateTime, 1000);
            
            // Update MT5 status every 5 seconds
            setInterval(updateFooterMT5Status, 5000);
            // Wire global modal close buttons
            (function(){
              var overlay = document.getElementById('flowModalOverlay');
              if(!overlay) return;
              overlay.addEventListener('click', function(e){
                if(e.target === overlay || e.target.classList.contains('gce-modal-close')){
                  overlay.style.display = 'none';
                  var canvas = document.getElementById('flowModalCanvas');
                  if(canvas) canvas.innerHTML = '';
                }
              });
            })();
        });
    </script>
    <script src="{% static 'main/js/flow_modal.js' %}"></script>
</body>
</html>
